events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 512m;

  upstream acyberschool_web { server web:8000; }

  server {
    listen 80;
    server_name _;

    location /static/ {
      alias /srv/static/;
      expires 1h;
    }

    location /protected-media/ {
      internal;
      alias /srv/media/;
      add_header Accept-Ranges bytes always;
      add_header Cache-Control "private, no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/courses/thumbnails/ {
      alias /srv/media/courses/thumbnails/;
      add_header Cache-Control "public, max-age=300" always;
    }

    location /media/institutions/logos/ {
      alias /srv/media/institutions/logos/;
      add_header Cache-Control "public, max-age=300" always;
    }

    location /media/ {
      return 404;
    }

    location / {
      proxy_pass http://acyberschool_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 180s;
    }
  }
}
