{% extends 'base.html' %}
{% block content %}
<div class="form-card">
  <div class="eyebrow">Acyberschool</div>
  <h1 style="font-size:38px">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="stack">{% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">{{ submit_label }}</button>
  </form>
</div>
{% endblock %}
