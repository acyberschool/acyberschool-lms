name: Notify Infrastructure

on:
  push:
    branches:
      - main
      - dev
    tags:
      - '[0-9]*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notify:
    name: Dispatch to upstream Infrastructure Repo
    runs-on: ubuntu-latest
    # This workflow belongs to the upstream LearnHouse deployment system.
    # Acyberschool hosts its own LMS, so the fork must never try to call the
    # upstream private infrastructure repository or require its secrets.
    if: >-
      github.repository == 'learnhouse/learnhouse' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            github.event.action == 'closed' ||
            (
              !github.event.pull_request.draft &&
              !endsWith(github.event.pull_request.user.login, '[bot]')
            )
          )
        )
      )
    steps:
      - name: Send repository dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: ${{ vars.INFRA_REPO }}
          event-type: source-update
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "event": "${{ github.event_name }}",
              "pr_number": "${{ github.event.pull_request.number || '' }}",
              "pr_action": "${{ github.event.action || '' }}",
              "repo": "${{ github.repository }}"
            }
