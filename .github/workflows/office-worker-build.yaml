name: Build Office Preview Worker

on:
  push:
    branches:
      - prod
      - dev
      - main
    paths:
      - 'Dockerfile.office-worker'
      - 'apps/api/**'
      - '.github/workflows/office-worker-build.yaml'
  pull_request:
    branches:
      - prod
      - dev
      - main
    paths:
      - 'Dockerfile.office-worker'
      - 'apps/api/**'
      - '.github/workflows/office-worker-build.yaml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: acyberschool/acyberschool-lms-office-worker

jobs:
  build:
    name: Office worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker on pull requests
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.office-worker
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=office-worker
          cache-to: type=gha,mode=max,scope=office-worker

      - name: Build and publish worker on branch pushes
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.office-worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha,scope=office-worker
          cache-to: type=gha,mode=max,scope=office-worker
