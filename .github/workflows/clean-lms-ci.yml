name: Acyberschool Clean LMS

on:
  push:
    branches:
      - clean-rebuild-20260902
      - main
    paths:
      - 'rebuild/**'
      - '.github/workflows/clean-lms-ci.yml'
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/clean-lms-ci.yml'

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acyberschool_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acyberschool_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: acyberschool_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SECRET_KEY: clean-lms-ci-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      COOKIE_SECURE: 'false'
      ACYBERSCHOOL_PUBLIC_URL: http://testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rebuild/requirements.txt

      - name: Install clean LMS dependencies
        run: pip install -r rebuild/requirements.txt

      - name: Verify model migrations are current
        working-directory: rebuild
        run: python manage.py makemigrations --check --dry-run

      - name: Create clean LMS database tables
        working-directory: rebuild
        run: python manage.py migrate --noinput

      - name: Django system check
        working-directory: rebuild
        run: python manage.py check

      - name: Critical instructor and learner flow tests
        working-directory: rebuild
        run: python manage.py test lms --verbosity 2

      - name: Validate Docker Compose
        run: docker compose -f rebuild/docker-compose.yml config

      - name: Build clean LMS Docker image
        run: docker build -t acyberschool-clean-lms:ci rebuild

      - name: Verify Office renderer is inside image
        run: docker run --rm --entrypoint libreoffice acyberschool-clean-lms:ci --headless --version

      - name: Start complete clean LMS Docker stack
        working-directory: rebuild
        run: docker compose up -d --build

      - name: Browser endpoint smoke test
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8095/login/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose -f rebuild/docker-compose.yml ps
            docker compose -f rebuild/docker-compose.yml logs --tail=200
            exit 1
          fi
          curl -fsS http://127.0.0.1:8095/login/ | grep -q "Acyberschool Classroom"

      - name: Build Mac test package
        run: |
          rm -rf package
          mkdir -p package/Acyberschool_Clean_LMS_Test
          cp -a rebuild/. package/Acyberschool_Clean_LMS_Test/
          find package/Acyberschool_Clean_LMS_Test -type d -name '__pycache__' -prune -exec rm -rf {} +
          find package/Acyberschool_Clean_LMS_Test -type f -name '*.pyc' -delete
          printf '%s\n' "$GITHUB_SHA" > package/Acyberschool_Clean_LMS_Test/BUILD_COMMIT.txt
          chmod +x package/Acyberschool_Clean_LMS_Test/Start_Acyberschool_Clean_Rebuild.command
          chmod +x package/Acyberschool_Clean_LMS_Test/Stop_Acyberschool_Clean_Rebuild.command
          cd package
          zip -r ../Acyberschool_Clean_LMS_Test.zip Acyberschool_Clean_LMS_Test

      - name: Upload Mac test package
        uses: actions/upload-artifact@v4
        with:
          name: Acyberschool_Clean_LMS_Test
          path: Acyberschool_Clean_LMS_Test.zip
          if-no-files-found: error
          retention-days: 14

      - name: Stop clean LMS test stack
        if: always()
        run: docker compose -f rebuild/docker-compose.yml down -v
